<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Reading | Sai Nakshatra</title><link rel="stylesheet" href="style.css"></head><body><div class="stars"></div><header class="nav"><a class="brand" href="index.html">Sai <span>Nakshatra</span></a></header><main class="page"><div class="section-heading"><p class="eyebrow">YOUR READING</p><h1 id="welcome">Your Chart ✨</h1><p id="birthSummary"></p></div><div id="resultArea" class="result-grid"></div><div class="cta-card section"><h2>Keep Exploring</h2><p>Use your reading as a tool for reflection and preparation.</p><a class="primary-btn" href="index.html#plans">Explore Plans</a></div></main><script>
const result=JSON.parse(localStorage.getItem("astrologyResult")||"null"),name=localStorage.getItem("birthName")||"Explorer",place=localStorage.getItem("birthPlace")||"";document.getElementById("welcome").textContent=`${name}'s Reading ✨`;document.getElementById("birthSummary").textContent=place?`Birthplace: ${place}`:"";const area=document.getElementById("resultArea");function card(title,value){const a=document.createElement("article");a.className="glass-card result-card";a.innerHTML=`<p class="eyebrow">${title}</p><h2>${value??"—"}</h2>`;return a}if(!result){area.appendChild(card("STATUS","No reading found"))}else{const c=result.chart||result.output||result;area.appendChild(card("RASHI / MOON SIGN",c?.rashi||c?.moon_sign||c?.moonSign||c?.rasi||c?.moon_rashi));area.appendChild(card("NAKSHATRA",c?.nakshatra||c?.birth_star||c?.birthStar));area.appendChild(card("PADA",c?.pada||c?.nakshatra_pada||c?.nakshatraPada));area.appendChild(card("BIRTHPLACE",result.birthplace||place))}
</script></body></html>
