<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birth Details | Sai Nakshatra</title><link rel="stylesheet" href="style.css"></head><body><div class="stars"></div><header class="nav"><a class="brand" href="index.html">Sai <span>Nakshatra</span></a></header><main class="page narrow"><div class="section-heading"><p class="eyebrow">YOUR JOURNEY</p><h1>Birth Details ✨</h1><p>Enter your details carefully so we can prepare your personalized chart.</p></div><form id="birthForm" class="glass-card form-card"><label>Full Name<input id="name" type="text" autocomplete="name" placeholder="Enter your name" required></label><label>Date of Birth<input id="date" type="date" required></label><label>Time of Birth<input id="time" type="time" required></label><label>Place of Birth<input id="place" type="text" autocomplete="off" placeholder="City, Country" required></label><button class="primary-btn" type="submit" id="continueBtn">Continue ✨</button><div id="status" class="status" aria-live="polite"></div><p class="small-note">Your API key stays securely on the server.</p></form></main><script src="astro-engine.js"></script><script>
document.getElementById("birthForm").addEventListener("submit",async e=>{e.preventDefault();const name=document.getElementById("name").value.trim(),date=document.getElementById("date").value,time=document.getElementById("time").value,place=document.getElementById("place").value.trim(),status=document.getElementById("status"),button=document.getElementById("continueBtn"),plan=new URLSearchParams(location.search).get("plan")||"starter";if(!name||!date||!time||!place)return;button.disabled=true;button.textContent="Preparing your chart…";status.className="status loading";status.textContent="Finding your birthplace and calculating your chart…";try{const result=await calculateRealAstrology({name,date,time,place});localStorage.setItem("birthName",name);localStorage.setItem("birthDate",date);localStorage.setItem("birthTime",time);localStorage.setItem("birthPlace",place);localStorage.setItem("selectedPlan",plan);localStorage.setItem("astrologyResult",JSON.stringify(result));location.href="result.html"}catch(error){console.error(error);button.disabled=false;button.textContent="Continue ✨";status.className="status error";status.textContent=error.message||"We couldn't prepare your chart. Please try again."}});
</script></body></html>
